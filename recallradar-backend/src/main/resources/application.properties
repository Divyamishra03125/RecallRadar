spring.application.name=recallradar-backend

spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties],optional:file:./.env[.properties],optional:file:./recallradar-backend/.env[.properties]

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recallradar}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:5174}

jwt.secret=${JWT_SECRET:RecallRadarEnterpriseSecretKeyForProductionTokenSigning2026Antigravity!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

gemini.api-key=${RECALLRADAR_GEMINI_API_KEY:${GEMINI_API_KEY:}}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
gemini.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-flash-lite-latest}
gemini.max-retries=${GEMINI_MAX_RETRIES:3}
gemini.retry-delay-ms=${GEMINI_RETRY_DELAY_MS:1000}
