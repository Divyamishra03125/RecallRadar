services:
  - type: web
    name: recallradar-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: recallradar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RECALLRADAR_GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173,http://localhost:3000"

databases:
  - name: recallradar-db
    databaseName: recallradar
    user: postgres
    plan: free
    region: oregon
